name: estudo

on:
  # O push serve so para o GitHub indexar o workflow; nao roda o estudo.
  push:
    paths:
      - ".github/workflows/estudo.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "sondar (inspeciona a API) ou estudo (roda a analise)"
        default: "estudo"
        type: choice
        options: [sondar, estudo]
      max_mercados:
        description: "Quantos mercados resolvidos coletar"
        default: "3000"
      lead_horas:
        description: "Usar o preco de quantas horas antes do fim"
        default: "24"
      volume_min:
        description: "Volume minimo em USD para o mercado entrar"
        default: "5000"
      limiar:
        description: "Vender SIM em mercados abaixo deste preco"
        default: "0.10"
      spread:
        description: "Custo de execucao, em unidades de preco"
        default: "0.01"

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Confirmar que o Actions esta ativo
        run: echo "Actions ativo neste repositorio."

      - name: Validar a maquinaria
        # Antes de tocar em dado real: o pipeline acha vies onde ele existe por
        # construcao, e nao acha onde o mercado e honesto? Sem isso, um "nao
        # achei vies" no Polymarket seria indistinguivel de codigo que nao acha
        # vies nenhum.
        run: python -m unittest discover -s tests -v

      - name: Sondar a API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'sondar' }}
        # Roda ANTES de confiar no parser: imprime a estrutura crua que a Gamma
        # devolve, para conferir nomes de campo em vez de adivinhar.
        run: python -m lab.fetch --sondar

      - name: Rodar o estudo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'estudo' }}
        run: |
          python -m lab.study \
            --max-mercados "${{ inputs.max_mercados }}" \
            --lead-horas "${{ inputs.lead_horas }}" \
            --volume-min "${{ inputs.volume_min }}" \
            --limiar "${{ inputs.limiar }}" \
            --spread "${{ inputs.spread }}"

      - name: Publicar resultados
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'estudo' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos resultados."
          else
            # commitar ANTES de rebasear: `git pull --rebase` recusa arvore suja
            git commit -m "resultados: ${{ inputs.max_mercados }} mercados, lead ${{ inputs.lead_horas }}h, limiar ${{ inputs.limiar }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: resultados/
