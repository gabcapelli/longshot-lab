name: estudo

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "sondar (inspeciona a API) ou estudo (roda a analise)"
        default: "estudo"
        type: choice
        options: [sondar, estudo]
      alvo:
        description: "Quantos mercados coletar"
        default: "4000"
      dias_max:
        description: "Ate quantos dias atras recuar"
        default: "180"
      por_dia:
        description: "Maximo de mercados por dia de encerramento (cobertura temporal)"
        default: "40"
      volume_min:
        description: "Volume minimo em USD"
        default: "10000"
      leads:
        description: "Horas antes do fim (o primeiro e o principal)"
        default: "6,24"
      limiar:
        description: "Vender SIM em mercados abaixo deste preco"
        default: "0.10"
      spread:
        description: "Custo de execucao, em unidades de preco"
        default: "0.01"

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar a maquinaria
        # Antes de tocar em dado real: o pipeline acha vies onde ele existe por
        # construcao, e nao acha onde o mercado e honesto? Sem isso, um "nao
        # achei vies" seria indistinguivel de codigo que nao acha vies nenhum.
        run: python -m unittest discover -s tests -v

      - name: Sondar a API
        if: ${{ inputs.modo == 'sondar' }}
        run: python -m lab.fetch --sondar

      - name: Rodar o estudo
        if: ${{ inputs.modo == 'estudo' }}
        run: |
          python -m lab.study \
            --alvo "${{ inputs.alvo }}" \
            --dias-max "${{ inputs.dias_max }}" \
            --por-dia "${{ inputs.por_dia }}" \
            --volume-min "${{ inputs.volume_min }}" \
            --leads "${{ inputs.leads }}" \
            --limiar "${{ inputs.limiar }}" \
            --spread "${{ inputs.spread }}"

      - name: Publicar resultados
        if: ${{ inputs.modo == 'estudo' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos resultados."
          else
            # commitar ANTES de rebasear: `git pull --rebase` recusa arvore suja
            git commit -m "resultados: ${{ inputs.alvo }} mercados, ${{ inputs.dias_max }}d, leads ${{ inputs.leads }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: resultados/
          if-no-files-found: ignore
